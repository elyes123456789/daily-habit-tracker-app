name: EAS mobile build

# Starts a build on Expo Application Services. Nothing is submitted to the App Store or Google Play.
#   - Automatically: an Android preview APK when a push to main changes the app itself (the paths
#     below). Docs, tests and workflow changes do not start a build.
#   - Manually: any platform and profile from the Actions tab.
# Every build uses your Expo account's build quota. To stop automatic builds, delete the `push`
# block.
#
# Before the first run:
#   1. Link the project once on your machine: npx eas-cli@latest init
#      (adds extra.eas.projectId to the app config; commit that change).
#   2. Create an access token at https://expo.dev/settings/access-tokens and save it as the
#      repository secret EXPO_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.test.*'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile from eas.json
        type: choice
        options: [development, preview, production]
        default: preview

permissions:
  contents: read

# A newer push replaces a run that has not submitted its build yet.
concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Inputs are empty on a push, so these are the automatic build's settings.
  PLATFORM: ${{ inputs.platform || 'android' }}
  PROFILE: ${{ inputs.profile || 'preview' }}

jobs:
  build:
    name: eas build (${{ inputs.platform || 'android' }}, ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check EAS is set up
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set. See the comments at the top of this workflow."
            exit 1
          fi
          if ! npx expo config --json | grep -q '"projectId"'; then
            echo "::error::The Expo project is not linked. Run 'npx eas-cli@latest init' locally and commit the result."
            exit 1
          fi
      - name: Start the build
        run: npx eas-cli@latest build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
