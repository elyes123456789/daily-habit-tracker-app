name: EAS mobile build

# Starts an Android and/or iOS build on Expo Application Services. Manual only: builds use your
# Expo account's build quota. Nothing is submitted to the App Store or Google Play.
#
# Before the first run:
#   1. Link the project once on your machine: npx eas-cli@latest init
#      (adds extra.eas.projectId to the app config; commit that change).
#   2. Create an access token at https://expo.dev/settings/access-tokens and save it as the
#      repository secret EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile from eas.json
        type: choice
        options: [development, preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    name: eas build (${{ inputs.platform }}, ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check EAS is set up
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set. See the comments at the top of this workflow."
            exit 1
          fi
          if ! npx expo config --json | grep -q '"projectId"'; then
            echo "::error::The Expo project is not linked. Run 'npx eas-cli@latest init' locally and commit the result."
            exit 1
          fi
      - name: Start the build
        run: npx eas-cli@latest build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
